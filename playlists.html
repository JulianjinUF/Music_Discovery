<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playlists - Music Discovery</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <h1>Your Playlists</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="playlists.html">Playlists</a>
    <a href="history.html">History</a>
  </nav>

  <!-- CREATE A PLAYLIST -->
  <h2>Create a Playlist</h2>
  <form action="#" method="get" id="playlist-form">
    <input type="text" id="playlist-name" placeholder="Enter a playlist name">
    <button type="submit">Create</button>
  </form>

  <!-- PLAYLISTS -->
  <h2>Playlists Created</h2>
  <div id="playlist-list">

    <div class="playlist">
      <div class="playlist-image"></div>
      <h3>Study Songs</h3>
      <p>5 songs</p>
    </div>

    <div class="playlist">
      <div class="playlist-image"></div>
      <h3>Workout</h3>
      <p>8 songs</p>
    </div>

    <div class="playlist">
      <div class="playlist-image"></div>
      <h3>Road Trip</h3>
      <p>12 songs</p>
    </div>

  </div>

  <!-- FAVORITES -->
  <h2>Favorites</h2>
  <ul id="favorites-list">
    <li>Favorite Song 1 - Artist 1</li>
    <li>Favorite Song 2 - Artist 2</li>
    <li>Favorite Song 3 - Artist 3</li>
  </ul>

</body>
</html>
